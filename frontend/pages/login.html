<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - KaamMitra.com</title>

    <link rel="stylesheet" href="../assets/css/common.css">
</head>


<body>


    <!-- ==================================================
         NAVBAR
         ================================================== -->

    <header>

        <nav>

            <!-- Logo -->
            <div class="home-logo">
    <a href="../index.html">
        <img src="../assets/images/logo.png" alt="KaamMitra">
    </a>
</div>


            <!-- Navigation Links -->
            <ul>

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="services.html">
                        Services
                    </a>
                </li>

                <li>
                    <a href="workers.html">
                        Find Workers
                    </a>
                </li>

                <li>
                    <a href="../index.html#how-it-works">
                        How It Works
                    </a>
                </li>

            </ul>


            <!-- Authentication -->
            <div class="nav-buttons">

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Register
                </a>

            </div>

        </nav>

    </header>



    <!-- ==================================================
         LOGIN SECTION
         ================================================== -->

    <main>

        <section class="login-section">


            <div class="login-box">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to your KaamMitra account.
                </p>


                <!-- Login Form -->
                <form>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email or Phone
                        </label>

                        <input
                            type="text"
                            id="email"
                            name="email"
                            placeholder="Enter your email or phone"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Forgot Password -->
                    <div class="forgot-password">

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->
                    <button type="submit">
                        Login
                    </button>


                </form>


                <!-- Register Link -->
                <p>

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </p>


            </div>

        </section>

    </main>



    <!-- ==================================================
         FOOTER
         ================================================== -->

    <footer>

        <p>
            © 2026 KaamMitra.com. All rights reserved.
        </p>

    </footer>


</body>

</html>
