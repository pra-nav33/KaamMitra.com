<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic information -->
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Register - KaamMitra.com</title>

    <link rel="stylesheet" href="../assets/css/common.css">
</head>


<body>


    <!-- ==================================================
         NAVBAR
         ================================================== -->

    <header>

        <nav>

            <!-- Logo -->
            <div class="home-logo">
    <a href="../index.html">
        <img src="../assets/images/logo.png" alt="KaamMitra">
    </a>
</div>

            <!-- Navigation Links -->
            <ul>

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="services.html">
                        Services
                    </a>
                </li>

                <li>
                    <a href="workers.html">
                        Find Workers
                    </a>
                </li>

                <li>
                    <a href="../index.html#how-it-works">
                        How It Works
                    </a>
                </li>

            </ul>


            <!-- Authentication -->
            <div class="nav-buttons">

                <a href="login.html">
                    Login
                </a>

                <a href="register.html">
                    Register
                </a>

            </div>

        </nav>

    </header>



    <!-- ==================================================
         REGISTRATION SECTION
         ================================================== -->

    <main>

        <section class="register-section">

            <div class="register-box">

                <h1>
                    Create Your KaamMitra Account
                </h1>

                <p>
                    Join KaamMitra as a customer or professional worker.
                </p>


                <!-- Registration Form -->
                <form>


                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <!-- Account Type -->
                    <div class="form-group">

                        <label for="account-type">
                            I want to
                        </label>

                        <select
                            id="account-type"
                            name="account-type"
                            required
                        >

                            <option value="">
                                Select Account Type
                            </option>

                            <option value="customer">
                                👤 Hire a Worker
                            </option>

                            <option value="worker">
                                🧑‍🔧 Work as a Professional
                            </option>

                        </select>

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- Terms -->
                    <div class="form-group">

                        <label>

                            <input
                                type="checkbox"
                                name="terms"
                                required
                            >

                            I agree to the Terms & Conditions.

                        </label>

                    </div>


                    <!-- Register Button -->
                    <button type="submit">
                        Create Account
                    </button>


                </form>


                <!-- Login Link -->
                <p>

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>

        </section>

    </main>



    <!-- ==================================================
         FOOTER
         ================================================== -->

    <footer>

        <p>
            © 2026 KaamMitra.com. All rights reserved.
        </p>

    </footer>


</body>

</html>
