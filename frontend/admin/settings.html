    <!-- ================================
         MAIN CONTENT
         ================================ -->

    <main class="portal-main">


        <section class="portal-header">

            <h1>
                Settings
            </h1>

            <p>
                Manage KaamMitra platform settings.
            </p>

        </section>



        <!-- ================================
             PLATFORM SETTINGS
             ================================ -->

        <section class="dashboard-section">

            <div class="section-heading">

                <h2>
                    Platform Settings
                </h2>

            </div>


            <form id="adminSettingsForm">


                <!-- PLATFORM NAME -->

                <div class="form-group">

                    <label for="platformName">
                        Platform Name
                    </label>

                    <input
                        type="text"
                        id="platformName"
                        value="KaamMitra.com"
                    >

                </div>



                <!-- MAINTENANCE MODE -->

                <div class="form-group">

                    <label>
                        System Status
                    </label>

                    <div>

                        <label>

                            <input
                                type="checkbox"
                                id="maintenanceMode"
                            >

                            Enable Maintenance Mode

                        </label>

                    </div>

                </div>



                <!-- CUSTOMER REGISTRATION -->

                <div class="form-group">

                    <label>
                        Customer Registration
                    </label>

                    <div>

                        <label>

                            <input
                                type="checkbox"
                                id="customerRegistration"
                                checked
                            >

                            Allow new customers to register

                        </label>

                    </div>

                </div>



                <!-- WORKER REGISTRATION -->

                <div class="form-group">

                    <label>
                        Worker Registration
                    </label>

                    <div>

                        <label>

                            <input
                                type="checkbox"
                                id="workerRegistration"
                                checked
                            >

                            Allow new workers to register

                        </label>

                    </div>

                </div>



                <!-- NOTIFICATIONS -->

                <div class="form-group">

                    <label>
                        Admin Notifications
                    </label>

                    <div>

                        <label>

                            <input
                                type="checkbox"
                                id="adminBookingNotifications"
                                checked
                            >

                            Booking notifications

                        </label>

                    </div>


                    <div>

                        <label>

                            <input
                                type="checkbox"
                                id="adminPaymentNotifications"
                                checked
                            >

                            Payment notifications

                        </label>

                    </div>


                    <div>

                        <label>

                            <input
                                type="checkbox"
                                id="adminComplaintNotifications"
                                checked
                            >

                            Complaint notifications

                        </label>

                    </div>

                </div>



                <!-- CURRENCY -->

                <div class="form-group">

                    <label for="platformCurrency">
                        Currency
                    </label>

                    <select id="platformCurrency">

                        <option value="NPR">
                            NPR - Nepalese Rupee
                        </option>

                        <option value="USD">
                            USD - US Dollar
                        </option>

                    </select>

                </div>



                <!-- SAVE -->

                <div class="card-actions">

                    <button
                        type="submit">

                        Save Settings

                    </button>

                </div>


            </form>

        </section>


    </main>

</div>
